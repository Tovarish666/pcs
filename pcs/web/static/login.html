<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<title>PCS — вход</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/app.css">
<script src="static/theme.js"></script>
</head>
<body class="login-body">
<div class="login-wrap">
  <svg class="cosmos" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <clipPath id="c-clip"><circle cx="1430" cy="1210" r="560"/></clipPath>
      <radialGradient id="c-planet" cx="28%" cy="20%" r="90%"><stop offset="0" class="c-p0"/><stop offset=".45" class="c-p1"/><stop offset="1" class="c-p2"/></radialGradient>
    </defs>
    <g transform="rotate(-11 800 500)">
      <ellipse class="c-orbit c-far" cx="800" cy="500" rx="930" ry="310"/>
      <ellipse class="c-orbit" cx="800" cy="500" rx="660" ry="205"/>
    </g>
    <circle class="c-air" cx="1430" cy="1210" r="580"/>
    <circle class="c-planet" cx="1430" cy="1210" r="560"/>
    <g clip-path="url(#c-clip)">
      <path class="c-band" d="M820 840C1060 760 1420 720 1990 760"/>
      <path class="c-band thin" d="M840 905C1090 836 1440 800 1990 836"/>
      <path class="c-band" d="M860 1000C1120 935 1460 905 1990 935"/>
    </g>
    <circle class="c-rim" cx="1430" cy="1210" r="560" stroke-dasharray="1100 2600" stroke-dashoffset="-1640"/>
    <g transform="rotate(-11 800 500)">
      <g><circle class="c-sat-glow" r="9"/><circle class="c-sat" r="3"/>
        <animateMotion dur="90s" repeatCount="indefinite" path="M140 500a660 205 0 1 0 1320 0a660 205 0 1 0 -1320 0"/></g>
    </g>
  </svg>
  <form id="login" class="login-card" autocomplete="on" novalidate>
    <div class="login-brand">
      <img class="mark" src="static/favicon.svg" alt="" width="40" height="40">
      <div><h1>PCS</h1><div class="muted" id="where">вход в панель</div></div>
    </div>
    <label>Логин <input name="user" autocomplete="username" required autofocus spellcheck="false" autocapitalize="off"></label>
    <label>Пароль
      <span class="pw-wrap">
        <input name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="eye" class="ghost icon" aria-label="показать пароль" title="показать пароль" aria-pressed="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </span>
    </label>
    <p id="caps" class="caps" hidden>Включён Caps Lock</p>
    <button type="submit" class="primary" id="go"><span class="lbl">Войти</span></button>
    <p id="msg" class="err" role="alert"></p>
  </form>
</div>
<script src="static/login.js"></script>
</body>
</html>
