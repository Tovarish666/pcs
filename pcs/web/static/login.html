<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<title>PCS — вход</title>
<link rel="icon" href="static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/app.css">
<script src="static/theme.js"></script>
</head>
<body class="login-body">
<div class="login-wrap">
  <form id="login" class="login-card" autocomplete="on" novalidate>
    <div class="login-brand">
      <span class="mark" aria-hidden="true"></span>
      <div><h1>PCS</h1><div class="muted" id="where">вход в панель</div></div>
    </div>
    <label>Логин <input name="user" autocomplete="username" required autofocus spellcheck="false" autocapitalize="off"></label>
    <label>Пароль
      <span class="pw-wrap">
        <input name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="eye" class="ghost icon" aria-label="показать пароль" title="показать пароль" aria-pressed="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </span>
    </label>
    <p id="caps" class="caps" hidden>Включён Caps Lock</p>
    <button type="submit" class="primary" id="go"><span class="lbl">Войти</span></button>
    <p id="msg" class="err" role="alert"></p>
  </form>
</div>
<script src="static/login.js"></script>
</body>
</html>
