# Шаблон конфига usb_modeswitch. hivelink передаёт его usb_modeswitch через -c;
# в /etc/usb_modeswitch.d ничего не кладётся: штатный переключатель живёт как жил.
#
# Zero-CD PID взяты из FcSwitch.inf оригинального пакета HUAWEI Drivers
# 5.05.01.158 — ровно те, что там держит FcSwitch.sys:
#   1f01, 1f02  "FC - USB Device"                (E3372h/s и родня)
#   1f10..1f14  "QuickStart Update USB Device"   ветка Vodafone: K5150 / K5160
#   1440        старая ревизия
#
# Само переключение — SCSI-команда rewind (opcode 0x11 в Bulk-Only CBW) внутри
# HuaweiNewMode. Модем сам выбирает, в какой рабочий PID уйти; TargetProductList
# нужен только чтобы usb_modeswitch признал переключение успешным и не писал
# "switch failed" в журнал.
#
# Список целей: RNDIS/HiLink PID из ewqsnet.inf + composite-stick из
# ew_usbenumfilter.inf + PID, встреченные в поле (155e, 1c1e, 1c20, 1442).

TargetVendor=0x12d1
TargetProductList="1400,1441,14bb,14bc,14bd,14be,14d7,14d8,14d9,14da,14db,14dc,14dd,14de,14df,14e0,14e1,14e2,14e3,14e4,14e5,14e6,14e7,14e8,14e9,14ea,14eb,14ec,14ed,14ee,14ef,14f6,14f7,14f8,14f9,14fa,14fd,1442,1506,1507,1508,1509,150a,150b,150c,150d,150e,150f,155e,1565,1566,1575,1576,1577,1578,1579,157a,157b,157f,1590,1591,1592,1c1e,1c20"
HuaweiNewMode=1
